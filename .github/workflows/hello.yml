name: Hello
run-name: ${{ github.actor }} is testing out GitHub Actions

on:
  push:
    branches:
      - 'master'
  pull_request:
    branches:
      - 'master'
  workflow_dispatch:

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - run: echo "Hello!"
      - run: uname -a
      - run: ls

permissions:
  contents: read
